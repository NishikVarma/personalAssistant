[package]
name = "assistant"
version = "0.1.0"
description = "Job Application Copilot - local-first job application and outreach assistant"
authors = ["Nishik Varma <nishikvonline@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["fs", "macros", "process", "rt"] }
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "windows-native"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
sha2 = "0.11.0"
pdf-extract = "0.12.0"

[dev-dependencies]
tempfile = "3"

